<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>pointrix browser bench</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #111;
        color: #eee;
      }
      #status {
        padding: 12px 16px;
        border-bottom: 1px solid #333;
        font-size: 13px;
      }
      #stage {
        padding: 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 2px;
      }
      .item {
        width: 30px;
        height: 30px;
        border-radius: 4px;
        background: #6366f1;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 9px;
        color: white;
        user-select: none;
        touch-action: none;
        will-change: transform;
      }
    </style>
  </head>
  <body>
    <div id="status">Loading…</div>
    <div id="stage"></div>
    <script type="module" src="./bench-page.ts"></script>
  </body>
</html>
