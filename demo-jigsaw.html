<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hyperact Jigsaw Puzzle Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a1a;
      color: #fff;
      overflow: hidden;
    }
    
    #app {
      width: 100vw;
      height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    
    .header {
      background: rgba(0, 0, 0, 0.5);
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(10px);
      z-index: 100;
    }
    
    .controls {
      display: flex;
      gap: 1rem;
      align-items: center;
    }
    
    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 0.375rem;
      cursor: pointer;
      font-size: 0.875rem;
      transition: background 0.2s;
    }
    
    button:hover {
      background: #2563eb;
    }
    
    button:disabled {
      background: #4b5563;
      cursor: not-allowed;
    }
    
    select {
      background: #374151;
      color: white;
      border: 1px solid #4b5563;
      padding: 0.5rem;
      border-radius: 0.375rem;
      cursor: pointer;
    }
    
    .stats {
      display: flex;
      gap: 2rem;
      font-size: 0.875rem;
    }
    
    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .stat-value {
      font-size: 1.5rem;
      font-weight: bold;
      color: #3b82f6;
    }
    
    .puzzle-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #111;
    }
    
    .puzzle-board {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    #puzzle-canvas {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      border: 2px solid #3b82f6;
      background: rgba(255, 255, 255, 0.05);
    }
    
    .puzzle-piece {
      position: absolute;
      cursor: grab;
      transition: filter 0.2s, transform 0.1s;
      will-change: transform;
    }
    
    .puzzle-piece:hover {
      filter: brightness(1.1);
    }
    
    .puzzle-piece.dragging {
      cursor: grabbing;
      z-index: 1000;
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.5));
    }
    
    .puzzle-piece.locked {
      cursor: default;
      filter: none;
    }
    
    .completion-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    
    .completion-overlay.show {
      opacity: 1;
      pointer-events: all;
    }
    
    .completion-modal {
      background: #1f2937;
      padding: 2rem;
      border-radius: 0.75rem;
      text-align: center;
      transform: scale(0.9);
      transition: transform 0.3s;
    }
    
    .completion-overlay.show .completion-modal {
      transform: scale(1);
    }
    
    .completion-modal h2 {
      font-size: 2rem;
      margin-bottom: 1rem;
      color: #10b981;
    }
    
    .completion-modal p {
      margin-bottom: 1.5rem;
      color: #9ca3af;
    }
    
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.5rem;
      color: #6b7280;
    }
    
    .edge-glow {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
    }
    
    .edge-glow.active {
      opacity: 1;
      box-shadow: inset 0 0 40px rgba(59, 130, 246, 0.5);
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="header">
      <div class="controls">
        <button id="new-game">New Game</button>
        <select id="difficulty">
          <option value="9">3x3 (Easy)</option>
          <option value="16" selected>4x4 (Medium)</option>
          <option value="25">5x5 (Hard)</option>
          <option value="36">6x6 (Expert)</option>
        </select>
        <button id="shuffle">Shuffle</button>
        <button id="hint">Show Hint</button>
        <button id="solve">Auto Solve</button>
      </div>
      
      <div class="stats">
        <div class="stat">
          <div class="stat-value" id="pieces-placed">0</div>
          <div>Pieces Placed</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="moves">0</div>
          <div>Moves</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="timer">00:00</div>
          <div>Time</div>
        </div>
      </div>
    </div>
    
    <div class="puzzle-container">
      <div class="puzzle-board">
        <div class="loading" id="loading">Loading puzzle...</div>
        <canvas id="puzzle-canvas" style="display: none;"></canvas>
        <div id="pieces-container"></div>
        <div class="edge-glow" id="edge-glow"></div>
      </div>
    </div>
    
    <div class="completion-overlay" id="completion">
      <div class="completion-modal">
        <h2>Puzzle Complete!</h2>
        <p>You solved the puzzle in <span id="final-time">00:00</span> with <span id="final-moves">0</span> moves!</p>
        <button id="play-again">Play Again</button>
      </div>
    </div>
  </div>
  
  <script type="module">
    import { Draggable } from './src/drag.ts'
    
    // Custom draggable for puzzle pieces that can be locked
    class PuzzlePieceDraggable extends Draggable {
      constructor(element, options) {
        super(element, options)
        this.isLocked = false
      }
      
      shouldHandleEvent(e) {
        // Don't handle events if the piece is locked
        return !this.isLocked
      }
      
      setLocked(locked) {
        this.isLocked = locked
      }
    }
    
    // Jigsaw puzzle implementation
    class JigsawPuzzle {
      constructor(container, options = {}) {
        this.container = container
        this.canvas = document.getElementById('puzzle-canvas')
        this.ctx = this.canvas.getContext('2d')
        this.piecesContainer = document.getElementById('pieces-container')
        
        this.options = {
          gridSize: 4,
          pieceSize: 100,
          snapDistance: 20,
          image: 'https://picsum.photos/800/600',
          ...options
        }
        
        this.pieces = []
        this.lockedPieces = new Set()
        this.connections = new Map()
        this.moves = 0
        this.startTime = null
        this.timerInterval = null
        
        this.init()
      }
      
      async init() {
        this.showLoading(true)
        await this.loadImage()
        this.generatePieces()
        this.renderPieces()
        this.shufflePieces()
        this.startTimer()
        this.showLoading(false)
      }
      
      showLoading(show) {
        document.getElementById('loading').style.display = show ? 'block' : 'none'
        this.canvas.style.display = show ? 'none' : 'block'
      }
      
      async loadImage() {
        return new Promise((resolve, reject) => {
          this.image = new Image()
          this.image.crossOrigin = 'anonymous'
          this.image.onload = () => {
            this.imageWidth = this.image.width
            this.imageHeight = this.image.height
            this.calculateDimensions()
            this.drawGuideGrid()
            resolve()
          }
          this.image.onerror = reject
          this.image.src = this.options.image
        })
      }
      
      drawGuideGrid() {
        // Clear canvas
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height)
        
        // Draw the image with reduced opacity
        this.ctx.save()
        this.ctx.globalAlpha = 0.3
        this.ctx.drawImage(this.image, 0, 0, this.puzzleWidth, this.puzzleHeight)
        this.ctx.restore()
        
        // Draw grid lines
        this.ctx.strokeStyle = '#3b82f6'
        this.ctx.lineWidth = 2
        this.ctx.setLineDash([5, 5])
        
        // Draw vertical lines
        for (let col = 0; col <= this.cols; col++) {
          this.ctx.beginPath()
          this.ctx.moveTo(col * this.pieceSize, 0)
          this.ctx.lineTo(col * this.pieceSize, this.puzzleHeight)
          this.ctx.stroke()
        }
        
        // Draw horizontal lines
        for (let row = 0; row <= this.rows; row++) {
          this.ctx.beginPath()
          this.ctx.moveTo(0, row * this.pieceSize)
          this.ctx.lineTo(this.puzzleWidth, row * this.pieceSize)
          this.ctx.stroke()
        }
        
        // Draw piece numbers in each grid cell
        this.ctx.setLineDash([])
        this.ctx.fillStyle = '#3b82f6'
        this.ctx.font = 'bold 16px Arial'
        this.ctx.textAlign = 'center'
        this.ctx.textBaseline = 'middle'
        
        for (let row = 0; row < this.rows; row++) {
          for (let col = 0; col < this.cols; col++) {
            const x = col * this.pieceSize + this.pieceSize / 2
            const y = row * this.pieceSize + this.pieceSize / 2
            
            // Draw a semi-transparent background for the text
            this.ctx.save()
            this.ctx.fillStyle = 'rgba(0, 0, 0, 0.5)'
            this.ctx.fillRect(x - 20, y - 10, 40, 20)
            this.ctx.restore()
            
            // Draw the piece number
            this.ctx.fillText(`${row + 1}-${col + 1}`, x, y)
          }
        }
      }
      
      calculateDimensions() {
        const gridSize = Math.sqrt(this.options.gridSize)
        this.cols = Math.floor(gridSize)
        this.rows = Math.floor(gridSize)
        
        // Calculate piece size to fit the screen
        const maxWidth = window.innerWidth * 0.8
        const maxHeight = window.innerHeight * 0.7
        
        const pieceWidth = Math.min(this.options.pieceSize, maxWidth / this.cols)
        const pieceHeight = Math.min(this.options.pieceSize, maxHeight / this.rows)
        
        this.pieceSize = Math.min(pieceWidth, pieceHeight)
        this.puzzleWidth = this.pieceSize * this.cols
        this.puzzleHeight = this.pieceSize * this.rows
        
        // Setup canvas
        this.canvas.width = this.puzzleWidth
        this.canvas.height = this.puzzleHeight
      }
      
      generatePieces() {
        this.pieces = []
        const tabSize = this.pieceSize * 0.2
        
        // First, generate random tab patterns for internal edges
        const horizontalTabs = [] // tabs between horizontal neighbors
        const verticalTabs = []   // tabs between vertical neighbors
        
        // Generate horizontal tabs (between columns)
        for (let row = 0; row < this.rows; row++) {
          horizontalTabs[row] = []
          for (let col = 0; col < this.cols - 1; col++) {
            horizontalTabs[row][col] = Math.random() > 0.5 ? 1 : -1
          }
        }
        
        // Generate vertical tabs (between rows)
        for (let row = 0; row < this.rows - 1; row++) {
          verticalTabs[row] = []
          for (let col = 0; col < this.cols; col++) {
            verticalTabs[row][col] = Math.random() > 0.5 ? 1 : -1
          }
        }
        
        // Now create pieces with coordinated tabs
        for (let row = 0; row < this.rows; row++) {
          for (let col = 0; col < this.cols; col++) {
            const piece = {
              id: `${row}-${col}`,
              row,
              col,
              x: col * this.pieceSize,
              y: row * this.pieceSize,
              width: this.pieceSize,
              height: this.pieceSize,
              correctX: col * this.pieceSize,
              correctY: row * this.pieceSize,
              tabs: {
                top: row > 0 ? -verticalTabs[row - 1][col] : 0,
                right: col < this.cols - 1 ? horizontalTabs[row][col] : 0,
                bottom: row < this.rows - 1 ? verticalTabs[row][col] : 0,
                left: col > 0 ? -horizontalTabs[row][col - 1] : 0
              }
            }
            
            this.pieces.push(piece)
          }
        }
      }
      
      createPiecePath(piece) {
        const path = new Path2D()
        const { x, y, width, height, tabs } = piece
        const tabHeight = width * 0.15
        const tabWidth = width * 0.3
        const neckWidth = tabWidth * 0.5
        const tabStart = (width - tabWidth) / 2
        
        path.moveTo(x, y)
        
        // Top edge
        if (tabs.top !== 0) {
          path.lineTo(x + tabStart, y)
          
          if (tabs.top === 1) {
            // Tab sticking out
            path.lineTo(x + tabStart + (tabWidth - neckWidth) / 2, y - tabHeight * 0.5)
            path.quadraticCurveTo(x + tabStart + (tabWidth - neckWidth) / 2, y - tabHeight, x + tabStart + tabWidth / 2, y - tabHeight)
            path.quadraticCurveTo(x + tabStart + tabWidth - (tabWidth - neckWidth) / 2, y - tabHeight, x + tabStart + tabWidth - (tabWidth - neckWidth) / 2, y - tabHeight * 0.5)
            path.lineTo(x + tabStart + tabWidth, y)
          } else {
            // Hole going in
            path.lineTo(x + tabStart + (tabWidth - neckWidth) / 2, y)
            path.quadraticCurveTo(x + tabStart + (tabWidth - neckWidth) / 2, y + tabHeight, x + tabStart + tabWidth / 2, y + tabHeight)
            path.quadraticCurveTo(x + tabStart + tabWidth - (tabWidth - neckWidth) / 2, y + tabHeight, x + tabStart + tabWidth - (tabWidth - neckWidth) / 2, y)
            path.lineTo(x + tabStart + tabWidth, y)
          }
        }
        path.lineTo(x + width, y)
        
        // Right edge
        if (tabs.right !== 0) {
          path.lineTo(x + width, y + tabStart)
          
          if (tabs.right === 1) {
            // Tab sticking out
            path.lineTo(x + width + tabHeight * 0.5, y + tabStart + (tabWidth - neckWidth) / 2)
            path.quadraticCurveTo(x + width + tabHeight, y + tabStart + (tabWidth - neckWidth) / 2, x + width + tabHeight, y + tabStart + tabWidth / 2)
            path.quadraticCurveTo(x + width + tabHeight, y + tabStart + tabWidth - (tabWidth - neckWidth) / 2, x + width + tabHeight * 0.5, y + tabStart + tabWidth - (tabWidth - neckWidth) / 2)
            path.lineTo(x + width, y + tabStart + tabWidth)
          } else {
            // Hole going in
            path.lineTo(x + width, y + tabStart + (tabWidth - neckWidth) / 2)
            path.quadraticCurveTo(x + width - tabHeight, y + tabStart + (tabWidth - neckWidth) / 2, x + width - tabHeight, y + tabStart + tabWidth / 2)
            path.quadraticCurveTo(x + width - tabHeight, y + tabStart + tabWidth - (tabWidth - neckWidth) / 2, x + width, y + tabStart + tabWidth - (tabWidth - neckWidth) / 2)
            path.lineTo(x + width, y + tabStart + tabWidth)
          }
        }
        path.lineTo(x + width, y + height)
        
        // Bottom edge
        if (tabs.bottom !== 0) {
          path.lineTo(x + tabStart + tabWidth, y + height)
          
          if (tabs.bottom === 1) {
            // Tab sticking out
            path.lineTo(x + tabStart + tabWidth - (tabWidth - neckWidth) / 2, y + height + tabHeight * 0.5)
            path.quadraticCurveTo(x + tabStart + tabWidth - (tabWidth - neckWidth) / 2, y + height + tabHeight, x + tabStart + tabWidth / 2, y + height + tabHeight)
            path.quadraticCurveTo(x + tabStart + (tabWidth - neckWidth) / 2, y + height + tabHeight, x + tabStart + (tabWidth - neckWidth) / 2, y + height + tabHeight * 0.5)
            path.lineTo(x + tabStart, y + height)
          } else {
            // Hole going in
            path.lineTo(x + tabStart + tabWidth - (tabWidth - neckWidth) / 2, y + height)
            path.quadraticCurveTo(x + tabStart + tabWidth - (tabWidth - neckWidth) / 2, y + height - tabHeight, x + tabStart + tabWidth / 2, y + height - tabHeight)
            path.quadraticCurveTo(x + tabStart + (tabWidth - neckWidth) / 2, y + height - tabHeight, x + tabStart + (tabWidth - neckWidth) / 2, y + height)
            path.lineTo(x + tabStart, y + height)
          }
        }
        path.lineTo(x, y + height)
        
        // Left edge
        if (tabs.left !== 0) {
          path.lineTo(x, y + tabStart + tabWidth)
          
          if (tabs.left === 1) {
            // Tab sticking out
            path.lineTo(x - tabHeight * 0.5, y + tabStart + tabWidth - (tabWidth - neckWidth) / 2)
            path.quadraticCurveTo(x - tabHeight, y + tabStart + tabWidth - (tabWidth - neckWidth) / 2, x - tabHeight, y + tabStart + tabWidth / 2)
            path.quadraticCurveTo(x - tabHeight, y + tabStart + (tabWidth - neckWidth) / 2, x - tabHeight * 0.5, y + tabStart + (tabWidth - neckWidth) / 2)
            path.lineTo(x, y + tabStart)
          } else {
            // Hole going in
            path.lineTo(x, y + tabStart + tabWidth - (tabWidth - neckWidth) / 2)
            path.quadraticCurveTo(x + tabHeight, y + tabStart + tabWidth - (tabWidth - neckWidth) / 2, x + tabHeight, y + tabStart + tabWidth / 2)
            path.quadraticCurveTo(x + tabHeight, y + tabStart + (tabWidth - neckWidth) / 2, x, y + tabStart + (tabWidth - neckWidth) / 2)
            path.lineTo(x, y + tabStart)
          }
        }
        
        path.closePath()
        return path
      }
      
      renderPieces() {
        this.piecesContainer.innerHTML = ''
        
        this.pieces.forEach((piece, index) => {
          const pieceCanvas = document.createElement('canvas')
          const margin = this.pieceSize * 0.3
          pieceCanvas.width = this.pieceSize + margin * 2
          pieceCanvas.height = this.pieceSize + margin * 2
          pieceCanvas.className = 'puzzle-piece'
          pieceCanvas.dataset.pieceId = piece.id
          pieceCanvas.style.width = `${pieceCanvas.width}px`
          pieceCanvas.style.height = `${pieceCanvas.height}px`
          
          const ctx = pieceCanvas.getContext('2d')
          
          // Translate to account for tabs
          ctx.save()
          ctx.translate(margin, margin)
          
          // Create clipping path
          const path = this.createPiecePath({
            ...piece,
            x: 0,
            y: 0
          })
          
          // Draw piece
          ctx.save()
          ctx.clip(path)
          
          // Draw image portion
          const sourceX = (piece.col * this.imageWidth) / this.cols
          const sourceY = (piece.row * this.imageHeight) / this.rows
          const sourceWidth = this.imageWidth / this.cols
          const sourceHeight = this.imageHeight / this.rows
          
          ctx.drawImage(
            this.image,
            sourceX, sourceY, sourceWidth, sourceHeight,
            0, 0, this.pieceSize, this.pieceSize
          )
          
          ctx.restore()
          
          // Draw border
          ctx.strokeStyle = 'rgba(0, 0, 0, 0.3)'
          ctx.lineWidth = 1
          ctx.stroke(path)
          
          // Add subtle shadow
          ctx.shadowColor = 'rgba(0, 0, 0, 0.3)'
          ctx.shadowBlur = 5
          ctx.shadowOffsetY = 2
          ctx.stroke(path)
          
          ctx.restore()
          
          // Position piece
          pieceCanvas.style.left = `${piece.x - margin}px`
          pieceCanvas.style.top = `${piece.y - margin}px`
          pieceCanvas.style.zIndex = index
          
          // Store piece data
          piece.element = pieceCanvas
          piece.currentX = piece.x
          piece.currentY = piece.y
          
          // Initialize transform to 0,0
          pieceCanvas.style.transform = 'translate3d(0px, 0px, 0)'
          
          this.piecesContainer.appendChild(pieceCanvas)
          
          // Make draggable
          this.makeDraggable(pieceCanvas, piece)
        })
      }
      
      makeDraggable(element, piece) {
        const draggable = new PuzzlePieceDraggable(element, {
          onDragStart: (event) => {
            element.classList.add('dragging')
            element.style.zIndex = '1000'
          },
          
          onDragMove: (event) => {
            // The draggable handles transform automatically
            // Check for snapping based on current visual position
            this.checkSnapping(piece)
          },
          
          onDragEnd: (event) => {
            element.classList.remove('dragging')
            this.moves++
            this.updateStats()
            
            // Get the current transform from the draggable
            const transform = piece.draggable.getPosition()
            
            // Calculate new base position
            const currentLeft = parseFloat(element.style.left) || 0
            const currentTop = parseFloat(element.style.top) || 0
            const newLeft = currentLeft + transform.x
            const newTop = currentTop + transform.y
            
            // Update piece tracking
            piece.x = newLeft + this.pieceSize * 0.3  // Add back the margin
            piece.y = newTop + this.pieceSize * 0.3   // Add back the margin
            
            // Final snap check
            if (this.snapToCorrectPosition(piece)) {
              this.onPiecePlaced(piece)
            } else {
              // Set new position and reset transform
              piece.element.style.left = `${newLeft}px`
              piece.element.style.top = `${newTop}px`
              piece.element.style.transform = 'translate3d(0px, 0px, 0)'
              piece.draggable.setPosition(0, 0)
            }
          }
        })
        
        piece.draggable = draggable
      }
      
      checkSnapping(draggedPiece) {
        const snapDistance = this.options.snapDistance
        
        // Get where the piece should go
        const targetLeft = this.getTargetLeft(draggedPiece)
        const targetTop = this.getTargetTop(draggedPiece)
        
        // Get current position
        const currentRect = draggedPiece.element.getBoundingClientRect()
        const containerRect = this.piecesContainer.getBoundingClientRect()
        const currentLeft = currentRect.left - containerRect.left
        const currentTop = currentRect.top - containerRect.top
        
        const dx = Math.abs(currentLeft - targetLeft)
        const dy = Math.abs(currentTop - targetTop)
        
        if (dx < snapDistance && dy < snapDistance) {
          // Visual feedback
          document.getElementById('edge-glow').classList.add('active')
        } else {
          document.getElementById('edge-glow').classList.remove('active')
        }
      }
      
      snapToCorrectPosition(piece) {
        const snapDistance = this.options.snapDistance
        
        // Get the absolute position where the piece should go
        const targetLeft = this.getTargetLeft(piece)
        const targetTop = this.getTargetTop(piece)
        
        // Calculate current absolute position
        const currentRect = piece.element.getBoundingClientRect()
        const containerRect = this.piecesContainer.getBoundingClientRect()
        const currentLeft = currentRect.left - containerRect.left
        const currentTop = currentRect.top - containerRect.top
        
        const dx = Math.abs(currentLeft - targetLeft)
        const dy = Math.abs(currentTop - targetTop)
        
        if (dx < snapDistance && dy < snapDistance) {
          // Snap to position
          piece.currentX = piece.correctX
          piece.currentY = piece.correctY
          piece.x = piece.correctX
          piece.y = piece.correctY
          
          // Reset to correct position with no transform
          piece.element.style.left = `${targetLeft}px`
          piece.element.style.top = `${targetTop}px`
          piece.element.style.transform = 'translate3d(0px, 0px, 0)'
          
          // Update draggable position
          piece.draggable.setPosition(0, 0)
          
          return true
        }
        
        return false
      }
      
      // Helper methods to get target positions
      getTargetLeft(piece) {
        // Get the board dimensions (parent of canvas and pieces container)
        const board = document.querySelector('.puzzle-board')
        const boardRect = board.getBoundingClientRect()
        
        // Calculate where the puzzle should be centered
        const puzzleTotalWidth = this.puzzleWidth
        const boardWidth = boardRect.width
        const puzzleStartX = (boardWidth - puzzleTotalWidth) / 2
        
        // Position is puzzle start + piece position - margin
        const targetLeft = puzzleStartX + piece.correctX - this.pieceSize * 0.3
        
        return targetLeft
      }
      
      getTargetTop(piece) {
        // Get the board dimensions (parent of canvas and pieces container)
        const board = document.querySelector('.puzzle-board')
        const boardRect = board.getBoundingClientRect()
        
        // Calculate where the puzzle should be centered
        const puzzleTotalHeight = this.puzzleHeight
        const boardHeight = boardRect.height
        const puzzleStartY = (boardHeight - puzzleTotalHeight) / 2
        
        // Position is puzzle start + piece position - margin
        const targetTop = puzzleStartY + piece.correctY - this.pieceSize * 0.3
        
        return targetTop
      }
      
      onPiecePlaced(piece) {
        this.lockedPieces.add(piece.id)
        piece.element.classList.add('locked')
        piece.draggable.setLocked(true)
        document.getElementById('edge-glow').classList.remove('active')
        
        // Redraw grid to show this cell is filled
        this.updateGuideGrid()
        
        // Play sound effect (if implemented)
        this.playSnapSound()
        
        this.updateStats()
        
        // Check if puzzle is complete
        if (this.lockedPieces.size === this.pieces.length) {
          this.onPuzzleComplete()
        }
      }
      
      updateGuideGrid() {
        this.drawGuideGrid()
        
        // Highlight filled positions
        this.ctx.save()
        this.ctx.fillStyle = 'rgba(16, 185, 129, 0.3)' // Green for completed
        
        this.pieces.forEach(piece => {
          if (this.lockedPieces.has(piece.id)) {
            this.ctx.fillRect(
              piece.col * this.pieceSize + 2,
              piece.row * this.pieceSize + 2,
              this.pieceSize - 4,
              this.pieceSize - 4
            )
          }
        })
        
        this.ctx.restore()
      }
      
      shufflePieces() {
        const margin = 50
        const containerWidth = this.container.clientWidth
        const containerHeight = this.container.clientHeight
        
        this.pieces.forEach(piece => {
          if (!this.lockedPieces.has(piece.id)) {
            // Set new base position
            piece.x = margin + Math.random() * (containerWidth - 2 * margin - this.pieceSize)
            piece.y = margin + Math.random() * (containerHeight - 2 * margin - this.pieceSize)
            piece.currentX = piece.x
            piece.currentY = piece.y
            
            // Reset transform and set position
            piece.element.style.transform = 'translate3d(0px, 0px, 0)'
            piece.element.style.left = `${piece.x - this.pieceSize * 0.3}px`
            piece.element.style.top = `${piece.y - this.pieceSize * 0.3}px`
            
            // Reset draggable position
            if (piece.draggable) {
              piece.draggable.setPosition(0, 0)
            }
          }
        })
      }
      
      startTimer() {
        this.startTime = Date.now()
        this.timerInterval = setInterval(() => {
          const elapsed = Math.floor((Date.now() - this.startTime) / 1000)
          const minutes = Math.floor(elapsed / 60)
          const seconds = elapsed % 60
          document.getElementById('timer').textContent = 
            `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`
        }, 1000)
      }
      
      updateStats() {
        document.getElementById('pieces-placed').textContent = this.lockedPieces.size
        document.getElementById('moves').textContent = this.moves
      }
      
      onPuzzleComplete() {
        clearInterval(this.timerInterval)
        
        const elapsed = Math.floor((Date.now() - this.startTime) / 1000)
        const minutes = Math.floor(elapsed / 60)
        const seconds = elapsed % 60
        
        document.getElementById('final-time').textContent = 
          `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`
        document.getElementById('final-moves').textContent = this.moves
        
        document.getElementById('completion').classList.add('show')
      }
      
      playSnapSound() {
        // Audio feedback can be added here
      }
      
      showHint() {
        // Find a random unlocked piece and highlight both the piece and where it goes
        const unlockedPieces = this.pieces.filter(p => !this.lockedPieces.has(p.id))
        if (unlockedPieces.length > 0) {
          const piece = unlockedPieces[Math.floor(Math.random() * unlockedPieces.length)]
          
          // Highlight the actual piece
          piece.element.style.filter = 'drop-shadow(0 0 20px #3b82f6) brightness(1.2)'
          piece.element.style.animation = 'pulse 2s ease-in-out infinite'
          
          // Get canvas position relative to container
          const canvasRect = this.canvas.getBoundingClientRect()
          const containerRect = this.piecesContainer.getBoundingClientRect()
          const canvasOffsetX = canvasRect.left - containerRect.left
          const canvasOffsetY = canvasRect.top - containerRect.top
          
          // Create arrow pointing from piece to target position
          const arrow = document.createElement('div')
          arrow.style.position = 'absolute'
          arrow.style.pointerEvents = 'none'
          arrow.style.zIndex = '999'
          
          // Get current piece center
          const pieceRect = piece.element.getBoundingClientRect()
          const pieceCenterX = pieceRect.left - containerRect.left + pieceRect.width / 2
          const pieceCenterY = pieceRect.top - containerRect.top + pieceRect.height / 2
          
          // Get target center
          const targetLeft = this.getTargetLeft(piece)
          const targetTop = this.getTargetTop(piece)
          const targetCenterX = targetLeft + (this.pieceSize * 1.6) / 2  // Account for margin
          const targetCenterY = targetTop + (this.pieceSize * 1.6) / 2   // Account for margin
          
          // Calculate arrow angle and length
          const dx = targetCenterX - pieceCenterX
          const dy = targetCenterY - pieceCenterY
          const angle = Math.atan2(dy, dx) * 180 / Math.PI
          const length = Math.sqrt(dx * dx + dy * dy)
          
          // Style the arrow line
          arrow.style.left = `${pieceCenterX}px`
          arrow.style.top = `${pieceCenterY}px`
          arrow.style.width = `${length}px`
          arrow.style.height = '3px'
          arrow.style.background = '#3b82f6'
          arrow.style.transformOrigin = '0 50%'
          arrow.style.transform = `rotate(${angle}deg)`
          arrow.style.opacity = '0.7'
          
          // Create arrowhead
          const arrowHead = document.createElement('div')
          arrowHead.style.position = 'absolute'
          arrowHead.style.right = '-10px'
          arrowHead.style.top = '-7px'
          arrowHead.style.width = '0'
          arrowHead.style.height = '0'
          arrowHead.style.borderLeft = '15px solid #3b82f6'
          arrowHead.style.borderTop = '10px solid transparent'
          arrowHead.style.borderBottom = '10px solid transparent'
          arrow.appendChild(arrowHead)
          
          // Also create target highlight
          const targetHint = document.createElement('div')
          targetHint.style.position = 'absolute'
          targetHint.style.left = `${targetLeft}px`
          targetHint.style.top = `${targetTop}px`
          targetHint.style.width = `${this.pieceSize * 1.6}px`  // Include margin
          targetHint.style.height = `${this.pieceSize * 1.6}px` // Include margin
          targetHint.style.border = '3px dashed #3b82f6'
          targetHint.style.borderRadius = '0.5rem'
          targetHint.style.pointerEvents = 'none'
          targetHint.style.animation = 'pulse 2s ease-in-out infinite'
          targetHint.style.background = 'rgba(59, 130, 246, 0.1)'
          
          this.piecesContainer.appendChild(arrow)
          this.piecesContainer.appendChild(targetHint)
          
          // Remove hints after 4 seconds
          setTimeout(() => {
            piece.element.style.filter = ''
            piece.element.style.animation = ''
            arrow.remove()
            targetHint.remove()
          }, 4000)
        }
      }
      
      autoSolve() {
        let delay = 0
        
        this.pieces.forEach(piece => {
          if (!this.lockedPieces.has(piece.id)) {
            setTimeout(() => {
              // Get current position
              const currentRect = piece.element.getBoundingClientRect()
              const containerRect = this.piecesContainer.getBoundingClientRect()
              const currentLeft = currentRect.left - containerRect.left
              const currentTop = currentRect.top - containerRect.top
              
              // Get target position
              const targetLeft = this.getTargetLeft(piece)
              const targetTop = this.getTargetTop(piece)
              
              const transformX = targetLeft - currentLeft
              const transformY = targetTop - currentTop
              
              // Animate using transform
              piece.element.style.transition = 'transform 0.5s ease-in-out'
              piece.element.style.transform = `translate3d(${transformX}px, ${transformY}px, 0)`
              
              setTimeout(() => {
                // After animation, set final position and reset transform
                piece.currentX = piece.correctX
                piece.currentY = piece.correctY
                piece.x = piece.correctX
                piece.y = piece.correctY
                
                piece.element.style.transition = ''
                piece.element.style.left = `${targetLeft}px`
                piece.element.style.top = `${targetTop}px`
                piece.element.style.transform = 'translate3d(0px, 0px, 0)'
                
                // Update draggable position
                piece.draggable.setPosition(0, 0)
                
                this.onPiecePlaced(piece)
              }, 500)
            }, delay)
            
            delay += 100
          }
        })
      }
      
      reset() {
        clearInterval(this.timerInterval)
        this.lockedPieces.clear()
        this.moves = 0
        this.pieces.forEach(piece => {
          piece.element.classList.remove('locked')
          piece.draggable.setLocked(false)
        })
        this.shufflePieces()
        this.startTimer()
        this.updateStats()
      }
    }
    
    // Initialize puzzle
    let puzzle
    
    window.addEventListener('DOMContentLoaded', () => {
      const container = document.querySelector('.puzzle-board')
      puzzle = new JigsawPuzzle(container, {
        gridSize: 16,
        image: `https://picsum.photos/seed/${Math.random()}/800/600`
      })
      
      // Event listeners
      document.getElementById('new-game').addEventListener('click', () => {
        const gridSize = parseInt(document.getElementById('difficulty').value)
        puzzle = new JigsawPuzzle(container, {
          gridSize,
          image: `https://picsum.photos/seed/${Math.random()}/800/600`
        })
      })
      
      document.getElementById('shuffle').addEventListener('click', () => {
        puzzle.shufflePieces()
      })
      
      document.getElementById('hint').addEventListener('click', () => {
        puzzle.showHint()
      })
      
      document.getElementById('solve').addEventListener('click', () => {
        puzzle.autoSolve()
      })
      
      document.getElementById('play-again').addEventListener('click', () => {
        document.getElementById('completion').classList.remove('show')
        puzzle.reset()
      })
      
      // Add CSS animation
      const style = document.createElement('style')
      style.textContent = `
        @keyframes pulse {
          0% { opacity: 0.5; transform: scale(1); }
          50% { opacity: 1; transform: scale(1.05); }
          100% { opacity: 0.5; transform: scale(1); }
        }
      `
      document.head.appendChild(style)
    })
  </script>
</body>
